openapi: 3.1.0

info:
  title: Payment Processing API
  version: 1.0.0
  description: Process and look up payments.

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /payments/{paymentId}:
    get:
      summary: Get payment
      operationId: get_payment
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Missing or invalid authentication
        "403":
          description: Caller is not authorized
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
