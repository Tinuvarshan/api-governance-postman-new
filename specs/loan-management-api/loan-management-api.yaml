openapi: 3.1.0

info:
  title: Loan Management API
  version: 1.0.0
  description: Manage loans and repayments.

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /loans/{loanId}:
    get:
      summary: Get loan
      operationId: get_loan
      security:
        - bearerAuth: []
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "401":
          description: Missing or invalid authentication
        "403":
          description: Caller is not authorized
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
