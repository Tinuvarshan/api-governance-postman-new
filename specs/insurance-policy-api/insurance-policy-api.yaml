openapi: 3.1.0

info:
  title: "Insurance Policy API"
  version: 1.0.0
  description: "Insurance policies for customers"

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
     /policies/{policyId}:
       get:
         summary: Get policy
         operationId: get_policy
         security:
           - bearerAuth: []
         parameters:
           - name: policyId
             in: path
             required: true
             schema:
               type: string
         responses:
           "200":
             description: Policy returned
           "401":
             description: Missing or invalid authentication
           "404":
             description: Policy not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer