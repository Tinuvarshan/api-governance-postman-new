openapi: 3.1.0

info:
  title: "Savings Account API"
  version: 1.0.0
  description: "Savings accounts for customers"

servers:
  - url: https://api.example.com/v1

security:
  - bearerAuth: []

paths:
  /savings/{accountId}:
    get:
      summary: Get savings account
      operationId: get_savings_account
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Savings account returned
        "401":
          description: Missing or invalid authentication
        "404":
          description: Account not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer